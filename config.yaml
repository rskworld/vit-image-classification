# Model Configuration
model:
  image_size: 224
  patch_size: 16
  num_classes: 1000
  dim: 768
  depth: 12
  heads: 12
  mlp_dim: 3072
  dropout: 0.1
  emb_dropout: 0.1

# Training Configuration
training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 10
  save_dir: "models"
  log_dir: "logs"
  device: "cuda"  # or "cpu"

# Data Configuration
data:
  train_dir: "data/train"
  val_dir: "data/val"
  num_workers: 4
  pin_memory: true

# Augmentation Configuration
augmentation:
  random_crop: true
  random_flip: true
  color_jitter: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

